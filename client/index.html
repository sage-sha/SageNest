<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>gerbils in a trenchcoat</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, sans-serif;
      max-width: 720px;
      margin: 3rem auto;
      padding: 0 1rem;
    }
    h1 { font-weight: 600; }
    h2 { font-weight: 600; font-size: 1rem; margin-top: 2rem; }
    .card {
      border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
      border-left-width: 3px;
      border-radius: 8px;
      padding: 1rem;
      margin: 0.75rem 0;
    }
    .card.live { border-left-color: seagreen; }
    .card.failed { border-left-color: crimson; }
    .card.superseded { opacity: 0.65; }
    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .badge {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border: 1px solid color-mix(in srgb, currentColor 30%, transparent);
      border-radius: 999px;
      padding: 0.1rem 0.5rem;
    }
    .meta { font-size: 0.85rem; opacity: 0.7; margin: 0.4rem 0 0; }
    .detail {
      font-size: 0.85rem;
      color: crimson;
      margin: 0.4rem 0 0;
    }
    .empty { opacity: 0.6; font-style: italic; }
  </style>
</head>
<body>
  <h1>gerbils in a trenchcoat</h1>
  <p>whats live right now:</p>
  <div id="status" class="empty">loading…</div>

  <h2>recent deploys</h2>
  <div id="history" class="empty">loading…</div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
