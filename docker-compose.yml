services:
  traefik:
    image: traefik:v3
    container_name: sagenest-traefik
    restart: unless-stopped
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "${TRAEFIK_WEB_BIND:-127.0.0.1:80:80}"
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - sagenest

networks:
  sagenest:
    name: sagenest
